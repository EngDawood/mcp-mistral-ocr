name = "mistral-ocr-telegram"
# Single Worker serving both the MCP server (src/worker.ts) and the Telegram
# bot (src/telegram/) — see src/worker-combined.ts for the routing. Both call
# the docling-api Worker, which owns the container and the monthly budget.
# Name kept so the registered Telegram webhook URL does not need to move.
main = "src/worker-combined.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Markdown cleaning is real CPU work and scales with document size.
# Only honoured on the Workers Paid plan (Standard usage model); on Free the
# 10 ms per-invocation limit applies regardless and large documents will fail.
[limits]
cpu_ms = 300000

# One object per Telegram user: holds their access flag, saved defaults and pending
# jobs, and runs jobs from an alarm (15 min wall time) rather than waitUntil,
# which only extends execution for 30 seconds.
[[durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PdfSplitter"]

# The qpdf splitter container is gone (Docling has no 50 MB document ceiling),
# so its Durable Object class goes with it.
[[migrations]]
tag = "v3"
deleted_classes = ["PdfSplitter"]

# Secrets (set with: npx wrangler secret put NAME)
#   TELEGRAM_TOKEN            bot token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET   random string; also gates POST /setup
#   DOCLING_API_KEY           key for the docling-api Worker (its API_KEY secret)
#   MCP_AUTH_KEY              optional, protects the /mcp endpoint
[vars]
ADMIN_ID = "801062947"
# The docling-api Worker (https://github.com/EngDawood/docling). Replace with your URL.
DOCLING_URL = "https://docling-api.<your-subdomain>.workers.dev"
OCR_LANG = "ar,en"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
